services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
  api:
    build: ./backend
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: backend/.env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "none"
  worker:
    build: ./backend
    command: python -m celery -A app.worker.celery_app worker --loglevel=WARNING --concurrency=2
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "none"
  beat:
    build: ./backend
    command: python -m celery -A app.worker.celery_app beat --loglevel=WARNING --schedule=/tmp/celerybeat-schedule
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "none"
